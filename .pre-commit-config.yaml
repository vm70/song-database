# yaml-language-server: $schema=https://www.schemastore.org/pre-commit-config.json
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        name: Ruff (Check)
        args: [--fix]
      - id: ruff-format
        name: Ruff (Format)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock
        name: UV Sync lockfile
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 0.58.0
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        pass_filenames: false
        additional_dependencies:
          [
            "fastapi[standard]>=0.142.2",
            "pydantic-settings>=2.15.0",
            "pyjwt>=2.15.1",
            "sqlmodel>=0.0.47",
            "pwdlib[argon2]>=0.3.1",
            "pymysql>=1.2.3",
          ]
  - repo: local
    hooks:
      - id: export-openapi-json
        name: Export OpenAPI JSON
        entry: "uv run songdb-server --export-openapi doc/generated/openapi.json"
        language: system
        types: [python]
        pass_filenames: false
      - id: generate-openapi-client
        name: Generate OpenAPI Client
        entry: "uv run openapi-generator-cli generate --input-spec doc/generated/openapi.json --generator-name python --minimal-update --output songdb-client"
        language: system
        types: [python]
        pass_filenames: false
