# yaml-language-server: $schema=https://www.schemastore.org/pre-commit-config.json
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        name: Ruff (Check)
        args: [--fix]
      - id: ruff-format
        name: Ruff (Format)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock
        name: UV Sync lockfile
      - id: pip-compile
        name: UV pip-compile
        args:
          [
            songdb-server/pyproject.toml,
            --output-file,
            songdb-server/requirements.txt,
          ]
        files: ^(pyproject\.toml)$

      - id: pip-compile
        name: UV pip-compile (development)
        args:
          [
            songdb-server/pyproject.toml,
            --group=dev,
            --output-file,
            songdb-server/requirements.dev.txt,
          ]
        files: ^(pyproject\.toml)$

  - repo: local
    hooks:
      # Pyrefly type checking has to be done locally since it has trouble with UV workspaces
      - id: pyrefly-check
        name: Pyrefly (type checking)
        entry: uv run pyrefly check .
        language: system
        types: [python]
        pass_filenames: false
