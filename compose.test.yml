services:
  db:
    image: mariadb
    volumes:

      !reset 
  test:
    build:
      context: ./songdb-server
      dockerfile: Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: "/bin/bash"
    command:
      - -c
      - |
        pip install pytest
        pytest .
