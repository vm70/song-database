services:
  db:
    image: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    ports:
      - 3306:3306
    environment:
      MARIADB_USER: ${MARIADB_USER?}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD?}
      MARIADB_DATABASE: ${MARIADB_DATABASE?}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD?}

  adminer:
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      - db

  songdb-server:
    profiles:
      - app
    build:
      context: ./songdb-server
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    depends_on:
      - db
    env_file:
      - .env

  test:
    profiles:
      - test
    build:
      context: ./songdb-server
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    depends_on:
      - db
    env_file:
      - .env
    entrypoint: "/bin/bash"
    command:
      - -c
      - |
        pip install pytest
        pytest .

volumes:
  mariadb_data:
