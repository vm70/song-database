name: song-database
services:
  mariadb:
    image: mariadb
    secrets:
      - mariadb-password
      - mariadb-root-password
    environment:
      - MARIADB_USER
      - MARIADB_PASSWORD_FILE
      - MARIADB_ROOT_PASSWORD_FILE
      - MARIADB_DATABASE
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  songdb-server:
    build:
      context: ./songdb-server
      dockerfile: Dockerfile
      target: base
    env_file:
      - .env
    environment:
      UVICORN_SSL_CERTFILE: /run/secrets/https-cert
      UVICORN_SSL_KEYFILE: /run/secrets/https-key
    secrets:
      - https-cert
      - https-key
      - jwt-private-key
      - jwt-public-key
      - mariadb-password
    depends_on:
      mariadb:
        restart: true
        condition: service_healthy
  adminer:
    profiles: ["dev"]
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
secrets:
  https-cert:
    file: ./secrets/https-cert.pem
  https-key:
    file: ./secrets/https-key.pem
  jwt-private-key:
    file: ./secrets/jwt-private-key.pem
  jwt-public-key:
    file: ./secrets/jwt-public-key.pem
  mariadb-password:
    file: ./secrets/mariadb-password.txt
  mariadb-root-password:
    file: ./secrets/mariadb-root-password.txt
