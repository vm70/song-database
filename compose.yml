x-services:

  mariadb-common: &mariadb-common
    image: mariadb
    secrets:
      - songdb-mariadb-password
      - songdb-mariadb-root-password
    environment:
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/songdb-mariadb-password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/songdb-mariadb-root-password
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  songdb-server-common: &songdb-server-common
    env_file:
      - .env
    secrets:
      - songdb-mariadb-password
      - songdb-auth-private-key
      - songdb-auth-public-key
      - songdb-https-cert
      - songdb-https-key

services:
  mariadb:
    <<: *mariadb-common
    profiles: [ "" ]
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - 3306:3306

  test-mariadb:
    <<: *mariadb-common
    profiles: [ "test" ]
    tmpfs:
      - /var/lib/mysql

  songdb-server:
    <<: *songdb-server-common
    profiles: [ "" ]
    build:
      context: ./songdb-server
      dockerfile: Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SONGDB__SQL__HOST: mariadb
    ports:
      - 8000:8000
    command: [ "uvicorn", "songdb_server.api.app:app", "--ssl-certfile", "/run/secrets/songdb-https-cert", "--ssl-keyfile", "/run/secrets/songdb-https-key", "--host", "0.0.0.0", "--port", "8000" ]

  test:
    <<: *songdb-server-common
    profiles: [ "test" ]
    build:
      context: ./songdb-server
      dockerfile: Dockerfile.test
    depends_on:
      test-mariadb:
        restart: true
        condition: service_healthy
    environment:
      SONGDB__SQL__HOST: test-mariadb

  adminer:
    profiles: [ "", "debug" ]
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mariadb

volumes:
  mariadb_data:

secrets:
  songdb-auth-private-key:
    file: ./secrets/songdb-auth-private-key.pem
  songdb-auth-public-key:
    file: ./secrets/songdb-auth-public-key.pem
  songdb-mariadb-password:
    file: ./secrets/songdb-mariadb-password
  songdb-mariadb-root-password:
    file: ./secrets/songdb-mariadb-root-password
  songdb-https-cert:
    file: ./secrets/cert.pem
  songdb-https-key:
    file: ./secrets/key.pem
