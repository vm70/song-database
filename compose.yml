services:
  db:
    image: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    ports:
      - 3306:3306
    environment:
      MARIADB_USER: ${MARIADB_USER?}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD?}
      MARIADB_DATABASE: ${MARIADB_DATABASE?}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD?}
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  adminer:
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      - db

  songdb-server:
    build:
      context: ./songdb-server
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  mariadb_data:
