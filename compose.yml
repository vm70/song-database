x-services:

  db-common: &db-common
    image: mariadb
    env_file:
      - .env
    environment:
      MARIADB_USER: ${MARIADB_USER?}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD?}
      MARIADB_DATABASE: ${MARIADB_DATABASE?}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD?}
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  songdb-server-common: &songdb-server-common
    build:
      context: ./songdb-server
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env

services:
  db:
    <<: *db-common
    profiles: [ "app" ]
    volumes:
      - mariadb_data:/var/lib/mysql

  songdb-server:
    <<: *songdb-server-common
    profiles: [ "app" ]
    depends_on:
      db:
        condition: service_healthy

  test-db:
    <<: *db-common
    profiles: [ "test" ]

  test:
    <<: *songdb-server-common
    profiles: [ "test" ]
    build:
      context: ./songdb-server
      dockerfile: Dockerfile.test
    environment:
      SONGDB__SQLALCHEMY_URL: mariadb+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@test-db:3306/${MARIADB_DATABASE}?charset=utf8mb4
    depends_on:
      test-db:
        restart: true
        condition: service_healthy
    command: [ "pytest", "." ]

volumes:
  mariadb_data: