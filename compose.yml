x-services:

  mariadb-common: &mariadb-common
    image: mariadb
    env_file:
      - .env
    secrets:
      - songdb-mariadb-password
      - songdb-mariadb-root-password
    environment:
      MARIADB_PASSWORD_FILE: /run/secrets/songdb-mariadb-password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/songdb-mariadb-root-password
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  songdb-server-common: &songdb-server-common
    env_file:
      - .env
    secrets:
      - songdb-mariadb-password
      - songdb-auth-secret-key
    ports:
      - 8000:8000

services:
  mariadb:
    <<: *mariadb-common
    profiles: [ "" ]
    volumes:
      - mariadb_data:/var/lib/mysql

  test-mariadb:
    <<: *mariadb-common
    profiles: [ "test" ]

  songdb-server:
    <<: *songdb-server-common
    profiles: [ "" ]
    build:
      context: ./songdb-server
      dockerfile: Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy

  test:
    <<: *songdb-server-common
    profiles: [ "test" ]
    build:
      context: ./songdb-server
      dockerfile: Dockerfile.test
    depends_on:
      test-mariadb:
        restart: true
        condition: service_healthy
    environment:
      SONGDB__SQL__HOST: test-mariadb

  adminer:
    profiles: [ "", "debug" ]
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mariadb

volumes:
  mariadb_data:

secrets:
  songdb-auth-secret-key:
    file: ./secrets/songdb-auth-secret-key
  songdb-mariadb-password:
    file: ./secrets/songdb-mariadb-password
  songdb-mariadb-root-password:
    file: ./secrets/songdb-mariadb-root-password
