x-services:

  mariadb-common: &mariadb-common
    image: mariadb
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  songdb-server-common: &songdb-server-common
    build:
      context: ./songdb-server
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env

services:
  mariadb:
    <<: *mariadb-common
    profiles: [ "" ]
    volumes:
      - mariadb_data:/var/lib/mysql
  
  test-db:
    <<: *mariadb-common
    profiles: [ "test" ]

  songdb-server:
    <<: *songdb-server-common
    profiles: [ "" ]
    depends_on:
      db:
        condition: service_healthy

  test:
    <<: *songdb-server-common
    profiles: [ "test" ]
    build:
      context: ./songdb-server
      dockerfile: Dockerfile.test
    depends_on:
      test-db:
        restart: true
        condition: service_healthy
    environment:
      SONGDB__SQLALCHEMY_URL: mariadb+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@test-mariadb:3306/${MARIADB_DATABASE}?charset=utf8mb4

volumes:
  mariadb_data: